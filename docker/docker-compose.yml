version: '3.8'

services:
  sourcegraph:
    image: sourcegraph/server:5.3.0
    container_name: testpilot-sourcegraph
    ports:
      - "7080:7080"
    volumes:
      - sourcegraph_config:/etc/sourcegraph
      - sourcegraph_data:/var/opt/sourcegraph
    environment:
      - DISABLE_TELEMETRY=true

volumes:
  sourcegraph_config:
  sourcegraph_data:
