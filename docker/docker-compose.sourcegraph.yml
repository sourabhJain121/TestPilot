version: '3.8'

services:
  sourcegraph:
    image: sourcegraph/server:5.3.0
    container_name: testpilot-sourcegraph
    restart: unless-stopped
    ports:
      - "7080:7080"
    volumes:
      - ../sourcegraph-data/config:/etc/sourcegraph
      - ../sourcegraph-data/data:/var/opt/sourcegraph
      - ..:/root/workspace:ro
    environment:
      - SRC_DISABLE_TELEMETRY=true
      - SRC_SYNTHETIC_SEARCH=true
      - SRC_LOG_LEVEL=warn
