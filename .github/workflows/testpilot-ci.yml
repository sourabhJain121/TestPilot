name: TestPilot AI CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      TESTPILOT_CI_MODE: "true"
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" pytest pytest-cov
      - name: Run Deterministic Boundary Generation
        run: |
          testpilot generate-deterministic --spec testbed/openapi.json --output tests/generated/test_deterministic_boundaries.py
      - name: Run Pytest Suite
        run: |
          pytest tests/ -v
